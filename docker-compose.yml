name: kv-tiktok

services:
  kv-tiktok:
    image: kv-tiktok:latest
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: kv-tiktok
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./cache:/app/cache
      - ./cookies.json:/app/cookies.json
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_PASSWORD=admin123
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
